services:
  redis:
    image: redis:7-alpine
    container_name: autocomplete-redis
    ports:
      - "6379:6379"

  app:
    build: .
    container_name: autocomplete-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
    depends_on:
      - redis