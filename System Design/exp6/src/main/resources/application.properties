server.port=8080

# Redis configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Rate limiter configuration
rate.limiter.bucket-capacity=100
rate.limiter.refill-interval-millis=1000
rate.limiter.refill-amount=1

