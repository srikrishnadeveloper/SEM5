spring.application.name=webcrawler

server.port=8080

# ---- Redis configuration ----
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=5000ms

# ---- Crawler configuration ----
crawler.thread-pool-size=8
crawler.default-max-depth=2
crawler.default-max-pages=50
crawler.connect-timeout-ms=5000
crawler.user-agent=SSNCE-UCS3513-WebCrawler/1.0

# ---- Redis key namespaces ----
crawler.redis.queue-key=crawler:queue
crawler.redis.visited-key=crawler:visited
crawler.redis.page-key-prefix=crawler:page:
crawler.redis.stats-key=crawler:stats

logging.level.com.sscse.webcrawler=INFO
