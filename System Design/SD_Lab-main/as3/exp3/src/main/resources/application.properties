server.port=8080

# In-memory H2 database - no installation needed, resets when app stops
# NOTE: still on H2 for now, wanted to swap this to mysql but no mysql server
# is installed on this machine yet - see README.md "What's different" section
spring.datasource.url=jdbc:h2:mem:urlshortenerdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Lets Hibernate create the table automatically from UrlMapping.java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Optional: view the database in a browser at http://localhost:8080/h2-console
spring.h2.console.enabled=true

# Redis - running locally via Memurai on the default port
# memurai is just redis for windows, it runs as a background service so no need to start it manually
# spring boot sees this + the redis dependency in pom.xml and auto builds a StringRedisTemplate bean for us
spring.data.redis.host=localhost
spring.data.redis.port=6379

# the 20mb storage cap + allkeys-lru eviction policy are NOT set here -
# those live on the redis/memurai server itself (maxmemory / maxmemory-policy config),
# not in this file. see the big comment block at the bottom of
# UrlShortenerController.java or README.md for how that's set up
