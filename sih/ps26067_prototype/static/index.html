<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OceanViz 3D — SIH26067</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌊%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="/static/style.css?v=7">
    <script src="/static/lib/cesium/Cesium.js"></script>
    <link rel="stylesheet" href="/static/lib/cesium/Widgets/widgets.css">
    <script src="/static/lib/chartjs/chart.min.js"></script>
</head>
<body>
    <header>
        <div class="brand">
            <h1>OceanViz 3D</h1>
            <span class="badge">SIH26067</span>
        </div>
        <p>3D ocean model + in-situ observation visualization platform</p>
    </header>

    <main>
        <aside id="controls" class="panel">
            <div class="section">
                <h2>Ocean Variables</h2>
                <div class="field">
                    <label for="variable">Variable</label>
                    <select id="variable"></select>
                </div>

                <div class="field">
                    <label for="depth">Depth <span id="depthVal">0 m</span></label>
                    <input id="depth" type="range" min="0" max="4" step="1" value="0">
                    <div class="ticks" id="depthTicks"></div>
                </div>

                <div class="field time-field">
                    <label for="time">Time Step <span id="timeVal">T0</span></label>
                    <div class="time-row">
                        <button id="playBtn" class="btn" title="Play animation">Play</button>
                        <input id="time" type="range" min="0" max="5" step="1" value="0">
                    </div>
                </div>

                <div class="legend" id="legendBox">
                    <div class="legend-title" id="legendTitle">Temperature (&#176;C)</div>
                    <div class="legend-gradient" id="legendGradient"></div>
                    <div class="legend-labels">
                        <span id="minVal">—</span>
                        <span id="maxVal">—</span>
                    </div>
                </div>
            </div>

            <div class="section">
                <h2>Layers</h2>
                <label class="toggle"><input type="checkbox" id="showCurrents" checked> Current vectors</label>
                <label class="toggle"><input type="checkbox" id="showInstruments" checked> Instruments</label>
            </div>

            <div class="section" id="selected-inst">
                <h2>Instrument Profile</h2>
                <p id="inst-name" class="inst-placeholder">Click an instrument on the globe</p>
                <div class="chart-wrap">
                    <canvas id="profileChart"></canvas>
                </div>
            </div>
        </aside>

        <div id="cesiumContainer"></div>
        <div id="probe" class="probe hidden">
            <div class="probe-title">Ocean value</div>
            <div id="probeContent"></div>
        </div>
        <div id="loading" class="loading-overlay visible">
            <div class="spinner"></div>
            <p>Loading 3D globe...</p>
        </div>
    </main>

    <script src="/static/app.js?v=7"></script>
</body>
</html>
